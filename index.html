.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}

.num small{color:var(--muted);display:block;font-size:12px;line-height:1.2}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}

th{font-size:12px;font-weight:700}

.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.ok i{background:var(--done)}
.chip.no{color:var(--muted)}

.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-items:start;--c:var(--p0)}

.menu summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px}
.menu summary::-webkit-details-marker{display:none}

.menu details[open] summary::after{content:"－"}
.menu details[open]{grid-column:1/-1}
.menu b{font-size:15px}
.menu span{font-size:13px;color:var(--muted);margin-left:auto}
.note{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.slip.pop{animation:none}}
</style>
</head>

const $=id=>document.getElementById(id);

// ---------- state ----------
let players=[], recs={}, me=null, busy=false, syncing=false, lastOK=null, err="";
const rk=(d,p)=>d+"|"+p;
try{ me=localStorage.getItem("exercise-me"); }catch(e){}
function setMe(p){ me=p; try{ localStorage.setItem("exercise-me",p); }catch(e){} render(); }
function colorOf(p){ const i=Math.max(0,players.indexOf(p))%8; return `--c:var(--p${i});--soft:var(--p${i}s)`; }

function applyState(s){
  if(!s) return;
  if(Array.isArray(s.players)&&s.players.length) players=s.players;
  if(Array.isArray(s.records)){ recs={}; s.records.forEach(r=>{ recs[rk(r.date,r.player)]={ex:r.ex,done:!!r.done}; }); }
  if(s.error) err=s.error;
}

// ---------- backend: Google Apps Script, or demo on this device ----------
const DEMO=!API_URL;
const demoStore={
  load(){ try{ return JSON.parse(localStorage.getItem("exercise-demo")||"null")||{players:DEFAULT_PLAYERS,records:[]}; }catch(e){ return {players:DEFAULT_PLAYERS,records:[]}; } },
  save(s){ try{ localStorage.setItem("exercise-demo",JSON.stringify(s)); }catch(e){} }
};
async function apiGet(){
  if(DEMO) return demoStore.load();
  const r=await fetch(API_URL+(API_URL.includes("?")?"&":"?")+"t="+Date.now());
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function apiPost(body){
  if(DEMO){
    const s=demoStore.load(), i=s.records.findIndex(r=>r.date===body.date&&r.player===body.player);
    if(body.action==="draw"&&i<0) s.records.push({date:body.date,player:body.player,ex:body.ex,done:false});
    if(body.action==="done"&&i>=0) s.records[i].done=body.done;
    demoStore.save(s); return s;
  }
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body)}); // text/plain：不會觸發 CORS 預檢
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function refresh(){
  if(syncing||busy) return;
  syncing=true;
  try{ applyState(await apiGet()); lastOK=new Date(); err=""; }
  catch(e){ err="連不上試算表，稍後自動再試"; }
  syncing=false; render();
}
async function send(body){
  try{ applyState(await apiPost(body)); lastOK=new Date(); err=""; }
  catch(e){ err="剛剛沒存到，請再按一次"; }
  render();
}

// ---------- actions ----------
function draw(p){
  if(busy||p!==me||recs[rk(TODAY,p)]) return;
  busy=true;
  const y=recs[rk(shift(TODAY,-1),p)];
  const pool=EX.filter(e=>!y||e.id!==y.ex);
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i=0; const steps=reduce?1:18;
  const tick=()=>{
    if(i<steps){ spinCard(p,EX[Math.floor(Math.random()*EX.length)].n); i++; setTimeout(tick,50+i*i*1.2); return; }
    recs[rk(TODAY,p)]={ex:pick.id,done:false};
    busy=false; render(); popCard(p);
    send({action:"draw",date:TODAY,player:p,ex:pick.id,exName:pick.n});
  };
  tick();
}
function toggleDone(p){
  const r=recs[rk(TODAY,p)]; if(!r||p!==me) return;
  r.done=!r.done; render();
  send({action:"done",date:TODAY,player:p,done:r.done});
}

// ---------- render ----------
function howto(e){
  if(!e||!e.s||!e.s.length) return "";
  return `<ol class="steps">${e.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`+
    (e.w?`<p class="warn"><b>小提醒</b>${esc(e.w)}</p>`:"")+
    `<a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.q)}" target="_blank" rel="noopener">看示範影片 ↗</a>`;
}
function cardHTML(p){
  const r=recs[rk(TODAY,p)], mine=p===me;
  const e=r?(BY[r.ex]||{n:r.ex,a:"",s:[]}):null;
  const st=!r?`<span class="state">還沒抽</span>`:r.done?`<span class="state ok">做完了</span>`:`<span class="state drawn">還沒做</span>`;
  let slip, act="";
  if(!r){
    slip=`<div class="slip"><span class="empty hand">${mine?"籤筒等你來抽":"還沒抽籤"}</span></div>`;
    if(mine) act=`<button class="primary" data-draw="${esc(p)}">抽一支</button>`;
  }else{
    const detail=mine?howto(e):(e.s&&e.s.length?`<details><summary>怎麼做</summary>${howto(e)}</details>`:"");
    slip=`<div class="slip has"><div class="name hand">${esc(e.n)}</div><div class="amt">${esc(e.a)}</div>${detail}</div>`;
    if(mine) act=`<button class="okbtn ${r.done?"on":""}" data-done="${esc(p)}">${r.done?"✓ 已完成（按一下取消）":"做完了，打卡"}</button>`;
  }
  if(!mine && !me) act=`<p class="hint">先在上面選「我是誰」</p>`;
  return `<article class="card ${mine?"me":""}" style="${colorOf(p)}" data-p="${esc(p)}">
    <div class="who"><div class="dot hand">${esc(p.slice(0,1))}</div><div><h2>${esc(p)}</h2>${mine?`<div class="you">這是你</div>`:""}</div>${st}</div>
    ${slip}${act}</article>`;
}
function spinCard(p,name){
  const s=document.querySelector(`.card[data-p="${CSS.escape(p)}"] .slip`);
  if(s){ s.className="slip has spin"; s.innerHTML=`<div class="name hand">${esc(name)}</div>`; }
}
function popCard(p){ const s=document.querySelector(`.card[data-p="${CSS.escape(p)}"] .slip`); if(s) s.classList.add("pop"); }

function stats(p){
  let done=0;
  for(const k in recs){ const [d,pp]=k.split("|"); if(pp===p&&recs[k].done&&d>=START&&d<=END&&d<=TODAY) done++; }
  let streak=0, d=recs[rk(TODAY,p)]?.done?TODAY:shift(TODAY,-1);
  while(d>=START && recs[rk(d,p)]?.done){ streak++; d=shift(d,-1); }
  return {done,streak};
}

function render(){
  const now=new Date();
  $("today").innerHTML=`<span><b>${now.getMonth()+1} 月 ${now.getDate()} 日</b>・星期${W[now.getDay()]}</span>`+(cd(TODAY)?`<span class="cd">${cd(TODAY)}</span>`:"");
  $("demo").hidden=!DEMO;

  // who am I
  const syncTxt=DEMO?"":err?err:lastOK?`已同步 ${pad(lastOK.getHours())}:${pad(lastOK.getMinutes())}`:"連線中…";
  $("whoami").innerHTML=`<span class="lbl">我是</span>`+players.map(p=>`<button class="pick ${p===me?"on":""}" style="${colorOf(p)}" data-me="${esc(p)}">${esc(p)}</button>`).join("")+`<span class="sync">${esc(syncTxt)}</span>`;

  // cards: me first
  if(!busy){
    const order=me&&players.includes(me)?[me,...players.filter(p=>p!==me)]:players;
    $("cards").innerHTML=order.map(cardHTML).join("");
  }

  // leaderboard
  const rows=players.map(p=>({p,...stats(p),today:recs[rk(TODAY,p)]})).sort((a,b)=>b.done-a.done||b.streak-a.streak);
  $("board").innerHTML=rows.map((r,i)=>`<div class="row" style="${colorOf(r.p)}">
    <span class="rank">${i+1}</span><span class="nm">${esc(r.p)}</span>
    <span class="bar"><i style="width:${Math.min(100,r.done/TOTAL*100)}%"></i></span>
    <span class="num"><b>${r.done}</b> / ${TOTAL} 天<small>${r.streak?`連續 ${r.streak} 天`:"—"}</small></span></div>`).join("");

  // last 7 days
  $("hhead").innerHTML=`<tr><th>日期</th>${players.map(p=>`<th style="${colorOf(p)};color:var(--c)">${esc(p)}</th>`).join("")}</tr>`;
  const hr=[];
  for(let i=0;i<7;i++){
    const k=shift(TODAY,-i), d=new Date(k+"T12:00:00"); if(k<START) break;
    const cell=p=>{const r=recs[rk(k,p)]; if(!r) return `<span class="chip no">—</span>`;
      return `<span class="chip ${r.done?"ok":""}"><i></i>${esc((BY[r.ex]||{n:r.ex}).n)}${r.done?"":"（沒做）"}</span>`;};
    hr.push(`<tr><td class="d">${i===0?"今天":`${d.getMonth()+1}/${d.getDate()} (${W[d.getDay()]})`}${cd(k)?`<small>${cd(k)}</small>`:""}</td>${players.map(p=>`<td>${cell(p)}</td>`).join("")}</tr>`);
  }
  $("hist").innerHTML=hr.join("");
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-me],[data-draw],[data-done]"); if(!t) return;
  if(t.dataset.me!==undefined) setMe(t.dataset.me);
  else if(t.dataset.draw!==undefined) draw(t.dataset.draw);
  else if(t.dataset.done!==undefined) toggleDone(t.dataset.done);
});

$("count").textContent=EX.length;
$("menu").innerHTML=EX.map(e=>`<details><summary><b>${esc(e.n)}</b><span>${esc(e.a)}</span></summary>${howto(e)}</details>`).join("");

players=DEFAULT_PLAYERS.slice();
render();
refresh();
// 每 30 秒更新一次別人的狀態；回到頁面時也更新
setInterval(()=>{ if(!document.hidden){ TODAY=key(new Date()); refresh(); } },30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ TODAY=key(new Date()); refresh(); } });
</script>
</body>
</html>
